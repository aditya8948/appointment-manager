<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Booking Appointment App — Register users and manage appointments easily." />
  <title>Booking Appointment App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">📅</span>
        <h1>Booking Appointment</h1>
      </div>
      <p class="subtitle">Register users and manage your appointment list</p>
    </header>

    <!-- Registration Form -->
    <section class="card form-card" id="form-section">
      <h2 class="card-title">Register New User</h2>
      <form id="registration-form" autocomplete="off">
        <div class="form-group">
          <label for="username">UserName</label>
          <input type="text" id="username" name="username" placeholder="Enter your name" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter email address" required />
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary">
          <span class="btn-text">Submit</span>
          <span class="btn-loader" hidden></span>
        </button>
      </form>
    </section>

    <!-- User List -->
    <section class="card list-card" id="list-section">
      <div class="card-header">
        <h2 class="card-title">Registered Users</h2>
        <span class="badge" id="user-count">0</span>
      </div>
      <div id="user-list-container">
        <p class="empty-state" id="empty-state">No users registered yet. Add one above!</p>
        <ul id="user-list" class="user-list"></ul>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
